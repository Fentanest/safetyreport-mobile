name: 동일 신고 데이터에 카카오 계정 2개 감지
description: 공유 업로드 보류에 대한 운영자 확인 요청입니다.
title: "[공유 보류] 운영자 확인 요청"
body:
  - type: markdown
    attributes:
      value: |
        이 게시판과 첨부 파일은 누구나 볼 수 있습니다.
        본인 확인에 필요한 마스킹 요약 파일과 안전신문고 공식 페이지 화면(스크린샷)만 첨부할 수 있습니다.
        확인에 필요하지 않은 차량번호, 사진, 정확한 위치, 신고 본문·전체 신고번호,
        카카오·공식 계정 식별자, 전화번호, 비밀번호, 토큰, DB 백업, 원본 로그는 올리지 마세요
        (스크린샷에 보이면 가린 뒤 첨부). 회신용 전화번호도 적지 마세요.
        앱의 문의 ID만으로도 확인 요청이 가능합니다. 첨부는 선택입니다.
        운영자가 확인한 뒤 저장소 관리자가 이슈를 삭제합니다.
        다만 알림 메일이나 외부에 남은 사본까지 지워진다고 보장하지는 않습니다.
  - type: input
    id: inquiry-id
    attributes:
      label: 문의 ID
      description: |
        앱의 문의 버튼으로 열면 자동으로 채워집니다. 내용을 확인하고 제출하세요.
        비어 있으면 앱의 업로드 보류 화면에서 문의 ID를 복사해 붙여넣어 주세요.
      placeholder: OB1-...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      description: 앱의 문의 버튼으로 열면 자동으로 채워집니다.
      placeholder: 앱 정보에 표시된 버전
    validations:
      required: false
  - type: textarea
    id: masked-summary
    attributes:
      label: 마스킹 요약 (선택)
      description: |
        앱의 문의 버튼으로 열면 자동으로 채워집니다. 내용을 확인하고 제출하세요
        (직접 수정하지 마세요). 비어 있어도 문의할 수 있습니다.
      render: json
    validations:
      required: false
  - type: textarea
    id: masked-summary-file
    attributes:
      label: 마스킹 요약 파일 첨부 (선택, 자동 입력이 안 됐을 때)
      description: |
        위 요약이 자동으로 채워지지 않았을 때, 앱에서 공유한 요약 파일을
        이 칸에 직접 첨부해 주세요. 원본 DB·사진·로그는 첨부하지 마세요.
    validations:
      required: false
  - type: textarea
    id: official-page-screenshot
    attributes:
      label: 안전신문고 공식 페이지 화면 첨부 (선택, 본인 확인용)
      description: |
        운영자가 본인 확인을 요청한 경우, 안전신문고 공식 페이지의 해당 신고 화면(스크린샷)을
        이 칸에 직접 첨부해 주세요. 앱이 자동으로 보내지 않습니다.
        확인에 필요하지 않은 차량번호·사진·정확한 위치·계정 정보는 가린 뒤 첨부하세요.
        첨부는 누구나 볼 수 있으며, 운영자 확인 뒤 이슈 삭제를 요청하면 관리자가 삭제합니다.
    validations:
      required: false
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: 공개 정보 확인
      options:
        - label: 이 문의와 첨부가 공개된다는 점을 확인했습니다.
          required: true
        - label: 확인에 필요하지 않은 계정 식별자·차량번호·정확 위치·사진·원문·전화번호·비밀번호·토큰은 넣지 않았거나 가렸습니다.
          required: true
