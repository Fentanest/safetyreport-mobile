name: 동일 신고 데이터에 카카오 계정 2개 감지
description: 공유 업로드 보류에 대한 운영자 확인 요청입니다.
title: "[공유 보류] 운영자 확인 요청"
body:
  - type: markdown
    attributes:
      value: |
        이 게시판과 첨부 파일은 공개됩니다.
        차량번호, 사진, 정확한 위치, 신고 본문·전체 신고번호,
        카카오·공식 계정 식별자, 전화번호, 토큰, DB 백업, 원본 로그를 올리지 마세요.
        회신용 전화번호도 적지 마세요.
        앱의 문의 ID만으로도 확인 요청이 가능합니다. 요약 첨부는 선택입니다.
  - type: input
    id: inquiry-id
    attributes:
      label: 문의 ID
      description: |
        앱의 문의 버튼으로 열면 자동으로 채워집니다. 내용을 확인하고 제출하세요.
        비어 있으면 앱의 업로드 보류 화면에서 문의 ID를 복사해 붙여넣어 주세요.
      placeholder: OB1-...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      description: 앱의 문의 버튼으로 열면 자동으로 채워집니다.
      placeholder: 앱 정보에 표시된 버전
    validations:
      required: false
  - type: textarea
    id: masked-summary
    attributes:
      label: 마스킹 요약 (선택)
      description: |
        앱의 문의 버튼으로 열면 자동으로 채워집니다. 내용을 확인하고 제출하세요
        (직접 수정하지 마세요). 비어 있어도 문의할 수 있습니다.
      render: json
    validations:
      required: false
  - type: textarea
    id: masked-summary-file
    attributes:
      label: 마스킹 요약 파일 첨부 (선택, 자동 입력이 안 됐을 때만)
      description: |
        위 요약이 자동으로 채워지지 않았을 때만, 앱에서 공유한 요약 파일을
        이 칸에 직접 첨부해 주세요. 원본 DB·사진·신고 상세 화면·로그는
        첨부하지 마세요.
    validations:
      required: false
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: 공개 정보 확인
      options:
        - label: 이 문의와 첨부가 공개된다는 점을 확인했습니다.
          required: true
        - label: 계정 식별자·차량번호·정확 위치·사진·원문·전화번호·토큰을 넣지 않았습니다.
          required: true
