name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: [self-hosted, Linux, X64, 234]
    permissions:
      contents: write

    steps:
    - name: Fix workspace ownership (pre-checkout)
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        BUILD_NAME=$(echo "$VERSION" | cut -d'+' -f1)
        BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
        echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        echo "tag=v$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "📦 Version: $BUILD_NAME+$BUILD_NUMBER"

    - name: Sync VERSION → pubspec.yaml
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        sed -i "s/^version:.*/version: $VERSION/" pubspec.yaml
        echo "✅ pubspec.yaml version: $VERSION"

    - name: Check if tag already exists
      id: check_tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG already exists. Skipping build."
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG does not exist. Proceeding with build."
        else
          echo "::error::API call failed with status: $HTTP_STATUS"
          exit 1
        fi

    - name: Build APK & AAB with Flutter Docker
      if: steps.check_tag.outputs.tag_exists == 'false'
      run: |
        docker run --rm \
          -v ${PWD}:/build \
          -v ~/.pub-cache:/root/.pub-cache \
          -v ~/.android-ndk-cache:/root/Android/Sdk/ndk \
          -v ~/mysafetyreport-android/key.properties:/build/android/key.properties:ro \
          -v ~/mysafetyreport-android/upload-keystore.jks:/build/upload-keystore.jks:ro \
          --workdir /build \
          ghcr.io/cirruslabs/flutter:stable \
          bash -c "\
            flutter build apk --release \
              --build-name=${{ steps.version.outputs.build_name }} \
              --build-number=${{ steps.version.outputs.build_number }} && \
            flutter build appbundle --release \
              --build-name=${{ steps.version.outputs.build_name }} \
              --build-number=${{ steps.version.outputs.build_number }} && \
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mysafetyreport.apk && \
            cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/mysafetyreport.aab"

    - name: Fix Docker file ownership
      if: always()
      run: sudo chown -R $(id -u):$(id -g) . || true

    - name: Upload APK artifact
      if: steps.check_tag.outputs.tag_exists == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}-apk
        path: build/app/outputs/flutter-apk/mysafetyreport.apk

    - name: Upload AAB artifact (Play Store용, 릴리즈 미포함)
      if: steps.check_tag.outputs.tag_exists == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}-aab
        path: build/app/outputs/bundle/release/mysafetyreport.aab

    - name: Create GitHub Release with APK
      if: steps.check_tag.outputs.tag_exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "나만의 안전신문고 앱 v${{ steps.version.outputs.build_name }}"
        body: |
          **나만의 안전신문고 Android 앱** v${{ steps.version.outputs.build_name }} 자동 릴리즈
          Commit: ${{ github.sha }}
        files: build/app/outputs/flutter-apk/mysafetyreport.apk
        draft: false
        prerelease: false
        generate_release_notes: true
