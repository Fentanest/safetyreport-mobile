name: Build & Release APK

# push(main): APK 없이 AAB 만 빌드해 Play 비공개 테스트(alpha) 트랙에 올린다(play-upload job 재사용).
#   versionCode 는 VERSION 파일의 `+N` 이 아니라 `100 + github.run_number` 로 만든다(2026-10-13 사용자
#   결정 — Play 기록 최대 42, run_number 71 이므로 항상 단조 증가한다). VERSION 파일의 `+N` 은 이 경로에서
#   더 이상 실제 빌드 번호로 쓰지 않는다(파일 형식은 유지 — 다른 스크립트가 파싱해도 그대로 동작한다).
#   artifact(AAB·mapping 전부) 보관 1일. 태그·GitHub Release 없음.
#
# workflow_dispatch(main) = 정식 릴리즈: 빌드하지 않는다. APK 를 올리지 않는다. 태그 v<이름> 을 실행
#   커밋에 만들고, 릴리스 노트(docs/releases/v<이름>.md, 없으면 실패)와 GitHub 기본 소스코드 zip만으로
#   GitHub Release 를 만든다(prerelease:false, generate_release_notes:false). 같은 태그가 이미 있으면 실패.
#
# 이전의 workflow_dispatch 입력 `verify_only`(태그·Release 생략하고 빌드 산출물만 artifact 로 보관)는
# 정리했다 — 정식 릴리즈 경로가 더 이상 빌드하지 않으므로 그 입력이 의미가 없어졌다. 빌드 전 검증은
# build-dev-apk.yml(dev, 수동) 또는 매 push 의 build-aab 로 충분하다.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────
  # push(main): AAB 만 빌드한다(APK 없음). play-upload 가 alpha 트랙에 올린다. 태그·Release 없음.
  # ────────────────────────────────────────────────────────────────
  build-aab:
    if: github.event_name == 'push'
    needs: verify
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: read
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
    - name: Fix workspace ownership (pre-checkout)
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # versionCode(빌드 번호) = 100 + run_number(2026-10-13 사용자 결정). VERSION 파일의 이름(+ 앞)만 쓰고,
    # 그 뒤 +N 은 더 이상 실제 빌드 번호로 쓰지 않는다(참고용 표시로만 파일에 남는다).
    - name: Compute version (build name from VERSION, versionCode = 100 + run_number)
      id: version
      run: |
        BUILD_NAME=$(cut -d'+' -f1 VERSION | tr -d '[:space:]')
        if [ -z "$BUILD_NAME" ]; then
          echo "::error::VERSION 파일에서 버전 이름을 읽을 수 없습니다."
          exit 1
        fi
        VERSION_CODE=$((100 + ${{ github.run_number }}))
        echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "📦 Version: $BUILD_NAME+$VERSION_CODE (versionCode=100+run_number, VERSION 파일의 +N 은 참고용)"

    # Flutter 는 tool/flutter-version(3.47.5) 고정 — 스크립트가 FLUTTER_BIN 또는 ~/development/flutter-<버전> 을 확인하고,
    # 다르면 실패한다. 서명키가 없으면 실패한다(debug 서명으로 대체하지 않음). SKIP_APK_BUILD=1 로 AAB 만 만든다.
    - name: Build AAB with pinned Flutter CLI
      env:
        COMMUNITY_SUPABASE_URL: ${{ vars.LOCAL_SUPABASE_URL }}
        COMMUNITY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LOCAL_SUPABASE_PUBLISHABLE_KEY }}
        FLUTTER_BIN: ${{ vars.FLUTTER_BIN || 'flutter' }}
        ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        SKIP_APK_BUILD: '1'
      run: |
        rm -rf -- ./dist   # self-hosted 작업 폴더에 남은 이전 빌드 보존본을 이번 artifact 에 섞지 않는다
        bash ./build_android_release.sh

    # 산출물별 R8 mapping·configuration·usage·resources·서명 인증서·SHA-256·build-meta.json (Play 스택 추적용 — 릴리즈에는 넣지 않음)
    - name: Upload mapping and build metadata
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.version_code }}-${{ github.sha }}-mapping
        path: dist/
        if-no-files-found: error
        retention-days: 1

    - name: Upload AAB artifact (Play Store용)
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.version_code }}-aab
        path: build/app/outputs/bundle/release/mysafetyreport.aab
        retention-days: 1

  # build-aab 와 분리된 job — 비밀값(PLAY_SERVICE_ACCOUNT_JSON)은 이 job(environment: play)에만 전달되고
  # self-hosted 빌드 러너에는 전달되지 않는다. build-aab 가 만든 서명 AAB·R8 mapping artifact 를 받아
  # Google Play 비공개 테스트(closed testing, API 트랙 이름 alpha) 트랙에 올린다. 매 push 마다 versionCode 가
  # 새로(100+run_number) 만들어지므로, 예전처럼 같은 태그가 있어 건너뛰는 조건은 없다 — 매 push 가 올린다.
  play-upload:
    needs: build-aab
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    # docs/releases/v<이름>.md(사람이 쓰는 릴리즈 노트)가 있으면 그 내용으로 "새로운 기능" 문구를 만든다.
    # push 빌드는 아직 정식 릴리스 노트가 없는 경우가 보통이라, 없으면(WHATSNEW_ALLOW_MISSING=1) 짧은 기본
    # 문구("테스트 빌드 <이름> (<versionCode>)")로 대체하고 실패하지 않는다(2026-10-13 사용자 결정).
    - name: Generate Play "what's new" (ko-KR) from release notes, or a short default
      env:
        WHATSNEW_ALLOW_MISSING: '1'
        ANDROID_VERSION_CODE: ${{ needs.build-aab.outputs.version_code }}
      run: node scripts/generate_whatsnew.mjs

    - name: Download AAB artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-aab.outputs.build_name }}+${{ needs.build-aab.outputs.version_code }}-aab
        path: artifacts/aab

    - name: Download mapping artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-aab.outputs.build_name }}+${{ needs.build-aab.outputs.version_code }}-${{ github.sha }}-mapping
        path: artifacts/mapping

    - name: Resolve AAB and AAB mapping.txt paths
      id: paths
      run: |
        AAB_PATH=$(find artifacts/aab -type f -name '*.aab' | head -n1)
        MAPPING_PATH=$(find artifacts/mapping -type f -path '*/aab/mapping.txt' | head -n1)
        if [[ -z "$AAB_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 파일을 찾지 못했습니다."
          exit 1
        fi
        if [[ -z "$MAPPING_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 의 mapping.txt 를 찾지 못했습니다."
          exit 1
        fi
        echo "aab=$AAB_PATH" >> "$GITHUB_OUTPUT"
        echo "mapping=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

    # r0adkll/upload-google-play v1.1.5 를 커밋 SHA 로 고정(태그 → 커밋 확인:
    # gh api repos/r0adkll/upload-google-play/git/ref/tags/v1.1.5).
    # 같은 versionCode 가 이미 Play 에 있으면 Google Play Developer API 가 그대로 오류를 내고,
    # 이 action 도 그 오류로 실패한다 — 메시지를 가리거나 삼키지 않는다(continue-on-error 없음).
    - name: Upload to Google Play closed testing (alpha) track
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.fentanest.mysafetyreport
        releaseFiles: ${{ steps.paths.outputs.aab }}
        track: alpha
        status: completed
        mappingFile: ${{ steps.paths.outputs.mapping }}
        whatsNewDirectory: whatsnew

  # ────────────────────────────────────────────────────────────────
  # workflow_dispatch(main) = 정식 릴리즈. 빌드하지 않는다, APK 를 올리지 않는다. 태그 v<이름> 을 실행
  # 커밋에 만들고, 릴리스 노트(docs/releases/v<이름>.md, 없으면 실패)와 GitHub 기본 소스코드 zip만으로
  # GitHub Release 를 만든다(prerelease:false, generate_release_notes:false). 같은 태그가 있으면 실패.
  # ────────────────────────────────────────────────────────────────
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Read version (build name only — versionCode 는 이 경로에서 쓰지 않는다)
      id: version
      run: |
        BUILD_NAME=$(cut -d'+' -f1 VERSION | tr -d '[:space:]')
        if [ -z "$BUILD_NAME" ]; then
          echo "::error::VERSION 파일에서 버전 이름을 읽을 수 없습니다."
          exit 1
        fi
        echo "tag=v$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "📦 Release tag: v$BUILD_NAME"

    - name: Fail if tag already exists
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "::error::태그 $TAG 가 이미 있습니다. 같은 버전으로 다시 릴리스할 수 없습니다."
          exit 1
        elif [ "$HTTP_STATUS" -ne 404 ]; then
          echo "::error::API call failed with status: $HTTP_STATUS"
          exit 1
        fi
        echo "Tag $TAG does not exist. Proceeding with release."

    - name: Require release notes
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        notes_file="docs/releases/$RELEASE_TAG.md"
        if [ ! -f "$notes_file" ]; then
          echo "::error::릴리스 노트 파일이 없습니다: $notes_file"
          exit 1
        fi

    # files 를 지정하지 않으므로 GitHub 기본 소스코드 zip/tar.gz 만 붙는다(APK/AAB 는 올리지 않는다).
    - name: Create GitHub Release (tag + release notes + default source zip only)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: "나만의 안전신문고 앱 ${{ steps.version.outputs.tag }}"
        body_path: docs/releases/${{ steps.version.outputs.tag }}.md
        draft: false
        prerelease: false
        generate_release_notes: false
