name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: '검증 전용 빌드(태그 확인·GitHub Release 생략, 산출물·mapping 만 artifact 로 보관)'
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build-apk:
    needs: verify
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: write
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}

    steps:
    - name: Fix workspace ownership (pre-checkout)
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        BUILD_NAME=$(echo "$VERSION" | cut -d'+' -f1)
        BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
        echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        echo "tag=v$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "📦 Version: $BUILD_NAME+$BUILD_NUMBER"

    - name: Sync VERSION → pubspec.yaml
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        sed -i "s/^version:.*/version: $VERSION/" pubspec.yaml
        echo "✅ pubspec.yaml version: $VERSION"

    - name: Check if tag already exists
      id: check_tag
      if: ${{ !inputs.verify_only }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG already exists. Skipping build."
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG does not exist. Proceeding with build."
        else
          echo "::error::API call failed with status: $HTTP_STATUS"
          exit 1
        fi

    # Flutter 는 tool/flutter-version(3.47.5) 고정 — 스크립트가 FLUTTER_BIN 또는 ~/development/flutter-<버전> 을 확인하고,
    # 다르면 실패한다. 서명키가 없으면 실패한다(debug 서명으로 대체하지 않음).
    - name: Build APK & AAB with pinned Flutter CLI
      if: ${{ inputs.verify_only || steps.check_tag.outputs.tag_exists == 'false' }}
      env:
        COMMUNITY_SUPABASE_URL: ${{ vars.LOCAL_SUPABASE_URL }}
        COMMUNITY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LOCAL_SUPABASE_PUBLISHABLE_KEY }}
        FLUTTER_BIN: ${{ vars.FLUTTER_BIN || 'flutter' }}
      run: |
        rm -rf -- ./dist   # self-hosted 작업 폴더에 남은 이전 빌드 보존본을 이번 artifact 에 섞지 않는다
        bash ./build_android_release.sh

    # 산출물별 R8 mapping·configuration·usage·resources·서명 인증서·SHA-256·build-meta.json (Play 스택 추적용 — 릴리즈에는 넣지 않음)
    - name: Upload mapping and build metadata
      if: ${{ inputs.verify_only || steps.check_tag.outputs.tag_exists == 'false' }}
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}-${{ github.sha }}-mapping
        path: dist/
        if-no-files-found: error
        retention-days: 90

    - name: Upload APK artifact
      if: ${{ inputs.verify_only || steps.check_tag.outputs.tag_exists == 'false' }}
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}-apk
        path: build/app/outputs/flutter-apk/mysafetyreport.apk
        retention-days: 1

    - name: Upload AAB artifact (Play Store용, 릴리즈 미포함)
      if: ${{ inputs.verify_only || steps.check_tag.outputs.tag_exists == 'false' }}
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}-aab
        path: build/app/outputs/bundle/release/mysafetyreport.aab
        retention-days: 1

    - name: Create GitHub Release with APK
      if: ${{ !inputs.verify_only && steps.check_tag.outputs.tag_exists == 'false' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "나만의 안전신문고 앱 v${{ steps.version.outputs.build_name }}"
        body: |
          **나만의 안전신문고 Android 앱** v${{ steps.version.outputs.build_name }} 자동 릴리즈
          Commit: ${{ github.sha }}
        files: build/app/outputs/flutter-apk/mysafetyreport.apk
        draft: false
        prerelease: false
        generate_release_notes: true

  # build-apk 와 분리된 job — 비밀값(PLAY_SERVICE_ACCOUNT_JSON)은 이 job(environment: play)에만 전달되고
  # self-hosted 빌드 러너에는 전달되지 않는다. build-apk 가 만든 서명 AAB·R8 mapping artifact 를 받아
  # Google Play 내부 테스트(internal) 트랙에만 올린다. verify_only 빌드와, workflow_dispatch 를 main 이
  # 아닌 브랜치에서 실행한 경우, 그리고 이미 같은 버전 태그가 있어 build-apk 가 아무 것도 새로 만들지
  # 않은 경우에는 올리지 않는다.
  play-upload:
    needs: build-apk
    if: >-
      !inputs.verify_only &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      needs.build-apk.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    # docs/releases/v<VERSION>.md(사람이 쓰는 릴리즈 노트)에서 whatsnew/whatsnew-ko-KR 을 만든다.
    # 해당 버전 노트 파일이 없으면 스크립트가 실패해 이 job 도 실패한다(버전 노트 없이 올리지 않음).
    - name: Generate Play "what's new" (ko-KR) from release notes
      run: node scripts/generate_whatsnew.mjs

    - name: Download AAB artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-apk.outputs.build_name }}+${{ needs.build-apk.outputs.build_number }}-aab
        path: artifacts/aab

    - name: Download mapping artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-apk.outputs.build_name }}+${{ needs.build-apk.outputs.build_number }}-${{ github.sha }}-mapping
        path: artifacts/mapping

    - name: Resolve AAB and AAB mapping.txt paths
      id: paths
      run: |
        AAB_PATH=$(find artifacts/aab -type f -name '*.aab' | head -n1)
        MAPPING_PATH=$(find artifacts/mapping -type f -path '*/aab/mapping.txt' | head -n1)
        if [[ -z "$AAB_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 파일을 찾지 못했습니다."
          exit 1
        fi
        if [[ -z "$MAPPING_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 의 mapping.txt 를 찾지 못했습니다."
          exit 1
        fi
        echo "aab=$AAB_PATH" >> "$GITHUB_OUTPUT"
        echo "mapping=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

    # r0adkll/upload-google-play v1.1.5 를 커밋 SHA 로 고정(태그 → 커밋 확인:
    # gh api repos/r0adkll/upload-google-play/git/ref/tags/v1.1.5).
    # 같은 versionCode 가 이미 Play 에 있으면 Google Play Developer API 가 그대로 오류를 내고,
    # 이 action 도 그 오류로 실패한다 — 메시지를 가리거나 삼키지 않는다(continue-on-error 없음).
    - name: Upload to Google Play internal track
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.fentanest.mysafetyreport
        releaseFiles: ${{ steps.paths.outputs.aab }}
        track: internal
        status: completed
        mappingFile: ${{ steps.paths.outputs.mapping }}
        whatsNewDirectory: whatsnew
