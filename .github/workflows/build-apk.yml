name: Play Alpha Build & Upload (manual)

# 2026-10-13 사용자 결정(재개정): 이 파일은 **alpha 전용 수동 실행**이다. push(main) 트리거를 없앴다 —
# main 에 push 해도 이 워크플로는 아무것도 하지 않는다(정식 릴리즈는 `.github/workflows/production.yml`).
# workflow_dispatch 로만 실행한다: verify → next-version-code(Play 최대 versionCode+1) →
#   build-aab(AAB만, SKIP_APK_BUILD=1, artifact 1일) → play-upload(Play 비공개 테스트 alpha 트랙).
#   입력 `action`(alpha/release 선택)은 없앴다 — 항상 alpha 다. 태그·GitHub Release 는 이 파일에서 만들지 않는다
#   (`production.yml` 이 정식 릴리즈에서 빌드·Play production 업로드·노트 확정·태그·Release 를 전부 한다).
#   versionCode 는 VERSION 파일의 `+N` 이 아니라 **Play 에 이미 올라간 최대 versionCode + 1** 로 만든다
#   (next-version-code job, Play Developer API 로 조회). GitHub run_number 에 기대지 않으므로 워크플로 이름 변경·
#   재생성으로 번호가 내려가 Play 가 거부하는 일이 없다. 연속 실행이 같은 값을 읽지 않게 concurrency 로 직렬화한다
#   (production.yml 과 같은 group 을 써서 두 워크플로도 서로 직렬화된다).
#   VERSION 파일의 `+N` 은 이 경로에서 더 이상 실제 빌드 번호로 쓰지 않는다(파일 형식은 유지 —
#   다른 스크립트가 파싱해도 그대로 동작한다).
#
# 이전(2026-10-13 이전 개정)의 workflow_dispatch 입력 `action=release`(태그+릴리스 노트+소스 zip 만드는
# `create-release` job)는 `production.yml` 로 옮기며 정리했다. 그보다 더 이전의 입력 `verify_only`도
# 이미 정리된 상태였다.
on:
  workflow_dispatch:
    inputs:
      whatsnew:
        description: 'alpha 출시 노트(선택, 500자 이내). 비우면 docs/releases/unreleased.md → 없으면 "테스트 빌드 <이름> (<versionCode>) · <커밋>"'
        type: string
        required: false
        default: ''

# production.yml 과 같은 group — 두 워크플로가 동시에 같은 '최대 versionCode' 를 읽고 같은 번호로
# 올리지 않도록 직렬화한다(취소 없이 대기). group 은 브랜치와 무관한 고정값이다(2026-10-16): 예전
# `mobile-build-${{ github.ref }}` 는 브랜치마다 group 이 달라 다른 브랜치의 alpha 와 main 정식 릴리스가 동시에
# 같은 'Play 최대 versionCode + 1' 을 읽을 수 있었다. Play 는 앱 하나에 versionCode 공간이 하나뿐이므로 group 도 하나다.
# 주의: GitHub concurrency 는 group 당 실행 1개 + 대기 1개만 둔다. 대기 중에 같은 group 실행을 또 넣으면 앞의 대기 실행은
# 취소된다(versionCode 중복은 생기지 않는다) — 취소됐으면 다시 실행한다.
concurrency:
  group: mobile-play-version-code
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────
  # AAB 만 빌드한다(APK 없음). play-upload 가 alpha 트랙에 올린다. 태그·Release 없음.
  # ────────────────────────────────────────────────────────────────
  # Play 에 이미 있는 최대 versionCode(번들·APK 전부)를 읽어 +1 한다. 비밀값은 environment: play 의 이 job 에만 간다.
  next-version-code:
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read
    outputs:
      version_code: ${{ steps.code.outputs.version_code }}
    steps:
    - name: Read max versionCode from Google Play
      id: code
      env:
        SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: |
        pip install --quiet google-auth requests
        python3 - <<'PY'
        import json, os, sys
        import requests
        from google.oauth2 import service_account
        from google.auth.transport.requests import Request

        pkg = "com.fentanest.mysafetyreport"
        creds = service_account.Credentials.from_service_account_info(
            json.loads(os.environ["SA_JSON"]),
            scopes=["https://www.googleapis.com/auth/androidpublisher"])
        creds.refresh(Request())
        h = {"Authorization": f"Bearer {creds.token}"}
        base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits"
        r = requests.post(base, headers=h, timeout=60); r.raise_for_status()
        edit = r.json()["id"]
        try:
            codes = []
            for kind, key in (("bundles", "bundles"), ("apks", "apks")):
                r = requests.get(f"{base}/{edit}/{kind}", headers=h, timeout=60); r.raise_for_status()
                codes += [int(x["versionCode"]) for x in r.json().get(key, [])]
        finally:
            requests.delete(f"{base}/{edit}", headers=h, timeout=60)
        if not codes:
            sys.exit("::error::Play 에서 기존 versionCode 를 하나도 읽지 못했습니다(권한·패키지 확인).")
        nxt = max(codes) + 1
        print(f"Play 최대 versionCode {max(codes)} → 이번 빌드 {nxt}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"version_code={nxt}\n")
        PY

  build-aab:
    needs: [verify, next-version-code]
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: read
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
    - name: Fix workspace ownership (pre-checkout)
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # versionCode = Play 최대 versionCode + 1(next-version-code job). VERSION 파일의 이름(+ 앞)만 쓰고,
    # 그 뒤 +N 은 더 이상 실제 빌드 번호로 쓰지 않는다(참고용 표시로만 파일에 남는다).
    - name: Compute version (build name from VERSION, versionCode = Play max + 1)
      id: version
      run: |
        BUILD_NAME=$(cut -d'+' -f1 VERSION | tr -d '[:space:]')
        if [ -z "$BUILD_NAME" ]; then
          echo "::error::VERSION 파일에서 버전 이름을 읽을 수 없습니다."
          exit 1
        fi
        VERSION_CODE='${{ needs.next-version-code.outputs.version_code }}'
        if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
          echo "::error::Play 에서 다음 versionCode 를 받지 못했습니다: '$VERSION_CODE'"
          exit 1
        fi
        echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "📦 Version: $BUILD_NAME+$VERSION_CODE (versionCode=Play 최대+1, VERSION 파일의 +N 은 참고용)"

    # Flutter 는 tool/flutter-version(3.47.5) 고정 — 스크립트가 FLUTTER_BIN 또는 ~/development/flutter-<버전> 을 확인하고,
    # 다르면 실패한다. 서명키가 없으면 실패한다(debug 서명으로 대체하지 않음). SKIP_APK_BUILD=1 로 AAB 만 만든다.
    - name: Build AAB with pinned Flutter CLI
      env:
        COMMUNITY_SUPABASE_URL: ${{ vars.LOCAL_SUPABASE_URL }}
        COMMUNITY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LOCAL_SUPABASE_PUBLISHABLE_KEY }}
        FLUTTER_BIN: ${{ vars.FLUTTER_BIN || 'flutter' }}
        ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        SKIP_APK_BUILD: '1'
      run: |
        rm -rf -- ./dist   # self-hosted 작업 폴더에 남은 이전 빌드 보존본을 이번 artifact 에 섞지 않는다
        bash ./build_android_release.sh

    # 산출물별 R8 mapping·configuration·usage·resources·서명 인증서·SHA-256·build-meta.json (Play 스택 추적용 — 릴리즈에는 넣지 않음)
    - name: Upload mapping and build metadata
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.version_code }}-${{ github.sha }}-mapping
        path: dist/
        if-no-files-found: error
        retention-days: 1

    - name: Upload AAB artifact (Play Store용)
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.version_code }}-aab
        path: build/app/outputs/bundle/release/mysafetyreport.aab
        retention-days: 1

  # build-aab 와 분리된 job — 비밀값(PLAY_SERVICE_ACCOUNT_JSON)은 이 job(environment: play)에만 전달되고
  # self-hosted 빌드 러너에는 전달되지 않는다. build-aab 가 만든 서명 AAB·R8 mapping artifact 를 받아
  # Google Play 비공개 테스트(closed testing, API 트랙 이름 alpha) 트랙에 올린다. 매 실행마다 versionCode 가
  # 새로(Play 최대+1) 만들어지므로, 같은 태그가 있어 건너뛰는 조건은 없다 — 매 실행이 올린다.
  play-upload:
    needs: build-aab
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    # docs/releases/unreleased.md(다음 버전 번호가 정해지기 전 누적하는 미출시 노트)가 있으면 그 내용으로
    # "새로운 기능" 문구를 만든다. alpha 수동 실행은 아직 정식 릴리스 노트(v<이름>.md)가 없는 경우가 보통이라,
    # 없으면(WHATSNEW_ALLOW_MISSING=1) 짧은 기본 문구("테스트 빌드 <이름> (<versionCode>)")로 대체하고
    # 실패하지 않는다(2026-10-13 사용자 결정).
    # 출시 노트 우선순위: 실행 때 입력한 문구 → docs/releases/unreleased.md(비었으면 건너뜀) →
    # "테스트 빌드 <이름> (<versionCode>) · <커밋>". 버전별 노트(v<이름>.md)는 쓰지 않는다.
    - name: Generate Play "what's new" (ko-KR)
      env:
        WHATSNEW_ALLOW_MISSING: '1'
        WHATSNEW_UNRELEASED: '1'
        WHATSNEW_TEXT: ${{ inputs.whatsnew }}
        WHATSNEW_COMMIT: ${{ github.sha }}
        ANDROID_VERSION_CODE: ${{ needs.build-aab.outputs.version_code }}
      run: |
        export WHATSNEW_COMMIT="${WHATSNEW_COMMIT:0:7}"
        node scripts/generate_whatsnew.mjs
        echo "--- 출시 노트 ---"; cat whatsnew/whatsnew-ko-KR

    - name: Download AAB artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-aab.outputs.build_name }}+${{ needs.build-aab.outputs.version_code }}-aab
        path: artifacts/aab

    - name: Download mapping artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-${{ needs.build-aab.outputs.build_name }}+${{ needs.build-aab.outputs.version_code }}-${{ github.sha }}-mapping
        path: artifacts/mapping

    - name: Resolve AAB and AAB mapping.txt paths
      id: paths
      run: |
        AAB_PATH=$(find artifacts/aab -type f -name '*.aab' | head -n1)
        MAPPING_PATH=$(find artifacts/mapping -type f -path '*/aab/mapping.txt' | head -n1)
        if [[ -z "$AAB_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 파일을 찾지 못했습니다."
          exit 1
        fi
        if [[ -z "$MAPPING_PATH" ]]; then
          echo "::error::다운로드한 artifact 에서 AAB 의 mapping.txt 를 찾지 못했습니다."
          exit 1
        fi
        echo "aab=$AAB_PATH" >> "$GITHUB_OUTPUT"
        echo "mapping=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

    # r0adkll/upload-google-play v1.1.5 를 커밋 SHA 로 고정(태그 → 커밋 확인:
    # gh api repos/r0adkll/upload-google-play/git/ref/tags/v1.1.5).
    # 같은 versionCode 가 이미 Play 에 있으면 Google Play Developer API 가 그대로 오류를 내고,
    # 이 action 도 그 오류로 실패한다 — 메시지를 가리거나 삼키지 않는다(continue-on-error 없음).
    - name: Upload to Google Play closed testing (alpha) track
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.fentanest.mysafetyreport
        releaseFiles: ${{ steps.paths.outputs.aab }}
        track: alpha
        status: completed
        mappingFile: ${{ steps.paths.outputs.mapping }}
        whatsNewDirectory: whatsnew

  # 정식 릴리즈(태그·GitHub Release·Play production 업로드·릴리스 노트 확정)는 `.github/workflows/production.yml`
  # 로 옮겼다(2026-10-13). 이 파일은 더 이상 태그·Release 를 만들지 않는다.
